<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PWVD – OBS WebRTC</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  video { width: 100%; height: 100%; object-fit: contain; background: transparent; }
  #msg { position: fixed; bottom: 10px; left: 10px; color: #fff; font: 14px monospace;
         background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; z-index: 10; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<div id="msg">Conectando…</div>
<script>
// Uso: obs.html?stream=nome-do-stream
// No OBS: Browser Source → URL: https://localhost:8443/obs.html?stream=eliabe
// Largura/Altura = resolução do stream (ex: 1920x1080)
// Marque "Desligar fonte quando não visível" = NÃO

const params = new URLSearchParams(location.search);
const stream = params.get('stream') || params.get('s') || 'live';
const msg = document.getElementById('msg');
const video = document.getElementById('v');
let pc = null;
let retryTimer = null;

async function connect() {
  cleanup();
  msg.textContent = `Conectando a "${stream}"…`;

  pc = new RTCPeerConnection({ iceServers: [], bundlePolicy: 'max-bundle' });
  pc.addTransceiver('video', { direction: 'recvonly' });

  pc.ontrack = (ev) => {
    video.srcObject = ev.streams[0];
    try { ev.receiver.playoutDelayHint = 0; } catch {}
    msg.textContent = `Ao vivo: ${stream}`;
    resetRetry();
    setTimeout(() => { msg.style.display = 'none'; }, 3000);
  };

  pc.oniceconnectionstatechange = () => {
    const st = pc.iceConnectionState;
    if (st === 'disconnected' || st === 'failed') {
      msg.style.display = '';
      msg.textContent = `Desconectado. Reconectando em 3s…`;
      scheduleRetry();
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  // Aguarda ICE gathering
  await new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') return resolve();
    const check = () => {
      if (pc.iceGatheringState === 'complete') {
        pc.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
    };
    pc.addEventListener('icegatheringstatechange', check);
    setTimeout(resolve, 1200);
  });

  try {
    const whepUrl = `/whep/${encodeURIComponent(stream)}`;
    const r = await fetch(whepUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp,
    });
    if (!r.ok) throw new Error(`WHEP ${r.status}`);
    const answer = await r.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answer });
  } catch (e) {
    msg.style.display = '';
    msg.textContent = `Erro: ${e.message}. Reconectando em 3s…`;
    scheduleRetry();
  }
}

function cleanup() {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  if (pc) { try { pc.close(); } catch {} pc = null; }
}

let retryDelay = 3000;
function scheduleRetry() {
  if (retryTimer) return;
  const delay = Math.min(retryDelay, 15000);
  msg.textContent = `Aguardando stream "${stream}"… (retry em ${Math.round(delay/1000)}s)`;
  retryTimer = setTimeout(() => { retryTimer = null; connect(); }, delay);
  retryDelay = Math.min(retryDelay * 1.5, 15000); // backoff até 15s
}
function resetRetry() { retryDelay = 3000; }

connect();
</script>
</body>
</html>
